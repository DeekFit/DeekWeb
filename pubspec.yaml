name: deekweb
description: >-
  A strongly-typed HTTP library for Dart and Flutter. 

  Provides mechanisms to define classes with response parsing for REST requests.
version: 1.1.0
repository: https://github.com/DeekFit/DeekWeb
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  http: ^1.6.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
